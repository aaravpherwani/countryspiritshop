<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Liquor Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --gold: #c5a059; --dark: #1a1a1a; }
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; }
        .controls { background: var(--dark); padding: 20px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .card { background: #222; border: 1px solid #333; color: white; height: 100%; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .img-box { height: 180px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px 4px 0 0; }
        .img-box img { max-height: 90%; max-width: 90%; object-fit: contain; }
        .badge-cat { background: var(--gold); color: black; font-size: 0.7rem; text-transform: uppercase; }
        .qty-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .instock { background: #28a745; } .outstock { background: #dc3545; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; color: var(--gold); }
    </style>
</head>
<body>

<div id="loading">Initialising Database...</div>

<div class="controls">
    <div class="container">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control bg-dark text-white border-secondary" placeholder="Search 17,000+ items...">
            </div>
            <div class="col-md-4">
                <select id="categoryFilter" class="form-select bg-dark text-white border-secondary">
                    <option value="">All Departments</option>
                </select>
            </div>
            <div class="col-md-4">
                <div id="statusText" class="small mt-2 text-secondary"></div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4">
    <div id="catalog" class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3"></div>
    <div id="loadMoreContainer" class="text-center my-5">
        <button id="loadMoreBtn" class="btn btn-outline-warning">View More Items</button>
    </div>
</div>

<script>
    // CONFIGURATION
    const CSV_URL = 'https://raw.githubusercontent.com/aaravpherwani/countryspiritshop/refs/heads/main/stock-7_30_2620_16_47.csv';
    const ITEMS_PER_PAGE = 48;
    
    let db = [];
    let filteredResults = [];
    let currentIndex = 0;

    // KEYWORD ENGINE: Maps names to Categories and generic Images
    const classifier = [
        { key: ['BOURBON', 'WHISKEY', 'RYE', 'WHISKY', 'E.H. TAYLOR', 'JIM BEAM'], cat: 'Whiskey', img: 'https://cdn-icons-png.flaticon.com/512/920/920605.png' },
        { key: ['VODKA', 'ABSOLUT', 'SMIRNOFF', 'TITOS', 'GREY GOOSE'], cat: 'Vodka', img: 'https://cdn-icons-png.flaticon.com/512/3257/3257121.png' },
        { key: ['TEQUILA', 'PATRON', 'CASAMIGOS', 'JOSE CUERVO', 'ANEJO', 'REPOSADO'], cat: 'Tequila', img: 'https://cdn-icons-png.flaticon.com/512/10042/10042318.png' },
        { key: ['CHARDONNAY', 'CABERNET', 'MERLOT', 'PINOT', 'SAUVIGNON', 'WINE', 'ROSE', 'PROSECCO'], cat: 'Wine', img: 'https://cdn-icons-png.flaticon.com/512/3100/3100657.png' },
        { key: ['IPA', 'ALE', 'LAGER', 'BEER', 'STOUT', 'PILSNER', '6PK', '12PK', 'BUD LIGHT'], cat: 'Beer', img: 'https://cdn-icons-png.flaticon.com/512/2415/2415392.png' },
        { key: ['RUM', 'BACARDI', 'CAPTAIN MORGAN', 'MALIBU'], cat: 'Rum', img: 'https://cdn-icons-png.flaticon.com/512/3133/3133036.png' },
        { key: ['GIN', 'TANQUERAY', 'BOMBAY'], cat: 'Gin', img: 'https://cdn-icons-png.flaticon.com/512/9183/9183363.png' },
        { key: ['SELTZER', 'WHITE CLAW', 'HIGH NOON'], cat: 'Seltzer', img: 'https://cdn-icons-png.flaticon.com/512/4603/4603612.png' },
        { key: ['CIGAR', 'ROCKY PATEL', 'OLIVA'], cat: 'Cigars', img: 'https://cdn-icons-png.flaticon.com/512/2397/2397750.png' }
    ];

    function getSmartData(name) {
        const upperName = name.toUpperCase();
        for (let rule of classifier) {
            if (rule.key.some(k => upperName.includes(k))) {
                return { category: rule.cat, image: rule.img };
            }
        }
        return { category: 'Other', image: 'https://cdn-icons-png.flaticon.com/512/2830/2830305.png' };
    }

    function init() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                db = results.data.filter(r => r.Name).map(item => {
                    const smart = getSmartData(item.Name);
                    return { ...item, Category: smart.category, Image: smart.image };
                });
                
                populateCategoryFilter();
                filteredResults = [...db];
                renderNextBatch();
            }
        });
    }

    function populateCategoryFilter() {
        const cats = [...new Set(db.map(i => i.Category))].sort();
        const select = document.getElementById('categoryFilter');
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.innerText = c;
            select.appendChild(opt);
        });
    }

    function renderNextBatch() {
        const container = document.getElementById('catalog');
        const nextSet = filteredResults.slice(currentIndex, currentIndex + ITEMS_PER_PAGE);
        
        nextSet.forEach(item => {
            const div = document.createElement('div');
            div.className = 'col';
            const inStock = parseFloat(item.Qty) > 0;
            div.innerHTML = `
                <div class="card p-2">
                    <div class="img-box">
                        <img src="${item.Image}" loading="lazy">
                    </div>
                    <div class="mt-2">
                        <span class="badge badge-cat mb-1">${item.Category}</span>
                        <div style="font-size: 0.8rem; line-height: 1.1; height: 2.2rem; overflow: hidden;" class="fw-bold">${item.Name}</div>
                        <div class="mt-2 small text-secondary">
                            <span class="qty-dot ${inStock ? 'instock' : 'outstock'}"></span>
                            ${Math.floor(item.Qty)} in stock
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });

        currentIndex += ITEMS_PER_PAGE;
        document.getElementById('statusText').innerText = `Showing ${Math.min(currentIndex, filteredResults.length)} of ${filteredResults.length} items`;
        document.getElementById('loadMoreBtn').style.display = currentIndex >= filteredResults.length ? 'none' : 'inline-block';
    }

    function handleFilter() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const cat = document.getElementById('categoryFilter').value;
        
        filteredResults = db.filter(i => {
            const mSearch = i.Name.toLowerCase().includes(search);
            const mCat = cat === "" || i.Category === cat;
            return mSearch && mCat;
        });

        currentIndex = 0;
        document.getElementById('catalog').innerHTML = '';
        renderNextBatch();
    }

    document.getElementById('searchInput').addEventListener('input', handleFilter);
    document.getElementById('categoryFilter').addEventListener('change', handleFilter);
    document.getElementById('loadMoreBtn').addEventListener('click', renderNextBatch);

    init();
</script>
</body>
</html>
