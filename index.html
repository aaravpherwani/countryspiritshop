<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Browse our in-stock liquor catalog." />
  <title>Liquor Catalog</title>
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="catalog" aria-labelledby="catalog-title">
    <header class="hero">
      <p class="eyebrow">AVAILABLE NOW</p>
      <h1 id="catalog-title">Liquor Catalog</h1>
      <p class="intro">Explore our current selection. Availability updates with your catalog data.</p>
    </header>

    <section class="controls" aria-label="Catalog controls">
      <label class="search-wrap" for="search">
        <span class="sr-only">Search products</span>
        <input id="search" type="search" placeholder="Search by name, brand, or type" autocomplete="off" />
        <span aria-hidden="true">⌕</span>
      </label>
      <label class="select-wrap" for="sort">
        <span>Sort</span>
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="name-asc">Name: A–Z</option>
          <option value="name-desc">Name: Z–A</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="proof-desc">Proof: high to low</option>
        </select>
      </label>
      <label class="select-wrap" for="sub-category">
        <span>Type</span>
        <select id="sub-category"><option value="All">All types</option></select>
      </label>
    </section>

    <nav id="category-filters" class="filters" aria-label="Filter by category"></nav>
    <p id="result-count" class="result-count" aria-live="polite"></p>
    <section id="product-grid" class="product-grid" aria-live="polite"></section>
    <div class="pagination"><button id="load-more" type="button" hidden>Show more products</button></div>
  </main>

  <template id="product-template">
    <article class="card">
      <div class="image-wrap"><img class="product-image" loading="lazy" alt="" /></div>
      <div class="card-content">
        <p class="category"></p>
        <h2 class="name"></h2>
        <p class="details"></p>
        <div class="card-footer"><strong class="price"></strong><span class="availability">In stock</span></div>
      </div>
    </article>
  </template>

  <template id="empty-template"><div class="empty"><h2>No bottles found</h2><p>Try a different search or category.</p><button type="button">Clear filters</button></div></template>
  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
