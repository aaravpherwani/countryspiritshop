<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse for high-performance CSV processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    /* Header & Hero */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
      padding: 2.5rem 1.5rem 3.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: -2rem auto 0;
      padding: 0 1.5rem;
    }

    /* Control Panel (Search & Filters) */
    .controls-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Top Row: Full-Width Search */
    .search-row {
      width: 100%;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: #f8fafc;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background-color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Filter Row: Dual Sorting Controls */
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sort-select {
      padding: 0.5rem 2rem 0.5rem 0.85rem;
      font-size: 0.875rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    .results-count {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* Product Card */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .category-badge {
      align-self: flex-start;
      background-color: #eff6ff;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .product-size {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .card-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: 1px dashed var(--border-color);
      padding-top: 1rem;
      margin-top: auto;
    }

    .price-container {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .product-price {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* States & Loading */
    .state-container {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .state-container i {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #94a3b8;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .filter-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Product Catalog</h1>
    <p>Explore our wide selection of items</p>
  </header>

  <div class="container">
    <!-- Filter & Search Panel -->
    <div class="controls-card">
      <!-- Search Bar -->
      <div class="search-row">
        <div class="input-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search products by name or code...">
        </div>
      </div>

      <!-- Sorting Options -->
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label"><i class="fa-solid fa-arrow-down-up-wide"></i> Sort By:</span>
          
          <!-- Name Filter -->
          <select id="sortNameSelect" class="sort-select">
            <option value="default">Name ↑↓</option>
            <option value="asc">Name (A → Z)</option>
            <option value="desc">Name (Z → A)</option>
          </select>

          <!-- Price Filter -->
          <select id="sortPriceSelect" class="sort-select">
            <option value="default">Price ↑↓</option>
            <option value="low-high">Price (Low → High)</option>
            <option value="high-low">Price (High → Low)</option>
          </select>
        </div>

        <div id="resultsCount" class="results-count">Showing 0 products</div>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="product-grid">
      <div class="state-container">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading inventory...</p>
      </div>
    </div>
  </div>

  <script>
    let rawProducts = [];
    let filteredProducts = [];

    // DOM Elements
    const productGrid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const sortNameSelect = document.getElementById('sortNameSelect');
    const sortPriceSelect = document.getElementById('sortPriceSelect');
    const resultsCount = document.getElementById('resultsCount');

    // Fetch and parse CSV
    document.addEventListener('DOMContentLoaded', () => {
      const csvFilePath = 'items-7_30_2622_08_49.csv';

      Papa.parse(csvFilePath, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          processCSVData(results.data);
        },
        error: function(err) {
          Papa.parse('items.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
              processCSVData(results.data);
            },
            error: function() {
              renderError('Failed to load items.csv. Please ensure the CSV file exists in the repository root.');
            }
          });
        }
      });
    });

    function processCSVData(data) {
      rawProducts = data.map(item => {
        const name = item['Name'] || item['Item Name'] || 'Unnamed Product';
        const price = parseFloat(item['Unit Price'] || item['Modifiers Price'] || item['Price'] || 0);
        const category = item['Category Name'] || item['Category Group Name'] || item['Category'] || 'General';
        const size = item['Size'] !== 'MISC' && item['Size'] ? item['Size'] : '';

        return {
          name: name.trim(),
          price: isNaN(price) ? 0 : price,
          category: category.trim(),
          size: size.trim(),
          upc: item['UPC Full'] || item['Stock Code'] || ''
        };
      }).filter(p => p.name !== '');

      applyFiltersAndSort();
    }

    function applyFiltersAndSort() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const sortName = sortNameSelect.value;
      const sortPrice = sortPriceSelect.value;

      // Search Filtering
      filteredProducts = rawProducts.filter(product => {
        return product.name.toLowerCase().includes(searchTerm) || 
               product.upc.toLowerCase().includes(searchTerm);
      });

      // Sorting Logic
      if (sortPrice !== 'default') {
        filteredProducts.sort((a, b) => sortPrice === 'low-high' ? a.price - b.price : b.price - a.price);
      } else if (sortName !== 'default') {
        filteredProducts.sort((a, b) => {
          return sortName === 'asc' 
            ? a.name.localeCompare(b.name) 
            : b.name.localeCompare(a.name);
        });
      }

      renderProducts(filteredProducts);
    }

    function renderProducts(products) {
      resultsCount.textContent = `Showing ${products.length} product${products.length !== 1 ? 's' : ''}`;

      if (products.length === 0) {
        productGrid.innerHTML = `
          <div class="state-container">
            <i class="fa-solid fa-box-open"></i>
            <p>No products found matching your search criteria.</p>
          </div>
        `;
        return;
      }

      productGrid.innerHTML = products.map(product => `
        <div class="product-card">
          <span class="category-badge">${escapeHTML(product.category)}</span>
          <h3 class="product-name">${escapeHTML(product.name)}</h3>
          ${product.size ? `<p class="product-size"><i class="fa-solid fa-tag"></i> ${escapeHTML(product.size)}</p>` : ''}
          <div class="card-footer">
            <div class="price-container">
              <span class="price-label">Price</span>
              <span class="product-price">$${product.price.toFixed(2)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderError(msg) {
      productGrid.innerHTML = `
        <div class="state-container">
          <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
          <p>${msg}</p>
        </div>
      `;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Event Listeners
    searchInput.addEventListener('input', applyFiltersAndSort);
    
    sortNameSelect.addEventListener('change', (e) => {
      if (e.target.value !== 'default') sortPriceSelect.value = 'default';
      applyFiltersAndSort();
    });

    sortPriceSelect.addEventListener('change', (e) => {
      if (e.target.value !== 'default') sortNameSelect.value = 'default';
      applyFiltersAndSort();
    });
  </script>
</body>
</html>
